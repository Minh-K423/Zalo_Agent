[project]
name = "zalo-aic-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Minh-K423", email = "nhatminh7247@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pathlib>=1.0.1",
]

[project.scripts]
zalo-aic-data = "zalo_aic_data:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint.per-file-ignores]
# Existing exploratory notebook; keep this runtime task from rewriting it.
"check_on.ipynb" = ["F401", "I001"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
